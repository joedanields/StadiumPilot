services:
  - type: web
    name: stadiumpilot
    runtime: node
    plan: free
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd server && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard — never commit the key
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: NODE_ENV
        value: production
